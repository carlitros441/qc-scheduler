<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QC Scheduler</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        qcRed: '#AD122A',
                        qcGray: '#303B41',
                        qcBg: '#F8F9FA'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-qcBg text-qcGray min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = window.FIREBASE_CONFIG || {};
        const missingFirebaseConfig = !firebaseConfig.apiKey || !firebaseConfig.projectId;
        const firebaseApp = missingFirebaseConfig ? null : firebase.initializeApp(firebaseConfig);
        const auth = firebaseApp ? firebase.auth() : null;
        const db = firebaseApp ? firebase.firestore() : null;

        const toDoc = (doc) => ({ id: doc.id, ...doc.data() });

        const listDocs = async (collectionName, orderByField = null, direction = "asc") => {
            let query = db.collection(collectionName);
            if (orderByField) query = query.orderBy(orderByField, direction);
            const snapshot = await query.get();
            return snapshot.docs.map(toDoc);
        };

        const saveDoc = async (collectionName, payload, id = null) => {
            const cleanPayload = { ...payload };
            delete cleanPayload.id;
            cleanPayload.updated_at = firebase.firestore.FieldValue.serverTimestamp();
            if (id) {
                await db.collection(collectionName).doc(id).set(cleanPayload);
                return id;
            }
            const ref = await db.collection(collectionName).add({
                ...cleanPayload,
                created_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            return ref.id;
        };

        const deleteDoc = (collectionName, id) => db.collection(collectionName).doc(id).delete();

        const getGroupedProtocols = async () => {
            const protocols = await listDocs("protocols");
            return protocols.reduce((grouped, protocol) => {
                const productType = protocol.product_type || "Unknown";
                grouped[productType] = grouped[productType] || [];
                grouped[productType].push(...(protocol.tests || []));
                grouped[productType] = [...new Set(grouped[productType])];
                return grouped;
            }, {});
        };

        const makeIcs = (schedule, personnel) => {
            const assignee = personnel.find(p => p.id === schedule.assignee_id) || {};
            const escapeText = (value = "") => String(value).replace(/,/g, "\\,").replace(/;/g, "\\;").replace(/\n/g, "\\n");
            const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            const uid = `${schedule.id || crypto.randomUUID()}@qc-scheduler`;
            const summary = `${escapeText(schedule.product_id)} ${escapeText(schedule.test_name)}`.trim();
            let startLine;
            let endLine;

            if (schedule.is_all_day) {
                const start = new Date(`${schedule.start_time.split("T")[0]}T00:00:00`);
                const end = new Date(start);
                end.setDate(end.getDate() + (schedule.duration_days || 1));
                const formatDate = (date) => date.toISOString().slice(0, 10).replace(/-/g, "");
                startLine = `DTSTART;VALUE=DATE:${formatDate(start)}`;
                endLine = `DTEND;VALUE=DATE:${formatDate(end)}`;
            } else {
                const formatDateTime = (value) => new Date(value).toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
                startLine = `DTSTART:${formatDateTime(schedule.start_time)}`;
                endLine = `DTEND:${formatDateTime(schedule.end_time)}`;
            }

            return [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//QC Scheduler//EN",
                "BEGIN:VEVENT",
                `UID:${uid}`,
                `DTSTAMP:${stamp}`,
                startLine,
                endLine,
                `SUMMARY:${summary}`,
                `DESCRIPTION:Product: ${escapeText(schedule.product_id)} | Batch: ${escapeText(schedule.batch_number)}\\nProduct Type: ${escapeText(schedule.product_type)}\\nAssigned To: ${escapeText(assignee.name || "Unknown")} (${escapeText(assignee.email || "")})`,
                "LOCATION:QC Laboratory",
                "STATUS:CONFIRMED",
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");
        };

        const downloadIcs = (schedule, personnel) => {
            const blob = new Blob([makeIcs(schedule, personnel)], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${schedule.id || "schedule"}.ics`;
            link.click();
            URL.revokeObjectURL(url);
        };

        // ---- Generic Modal Component ----
        const Modal = ({ title, children, onClose }) => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
                <div className="bg-white rounded-lg p-6 w-full max-w-xl relative shadow-xl max-h-[90vh] overflow-y-auto">
                    <button onClick={onClose} className="absolute top-4 right-4 text-qcGray hover:text-qcRed font-bold text-xl">&times;</button>
                    <h2 className="text-xl font-bold mb-4 border-b pb-2 text-qcRed">{title}</h2>
                    {children}
                </div>
            </div>
        );

        // =========================================================================
        // TAB 1: CREATE SCHEDULE
        // =========================================================================
        const CreateScheduleTab = ({ personnel }) => {
            const [protocols, setProtocols] = useState({});
            const [form, setForm] = useState({ product_id: '', batch_number: '', product_type: '' });
            const [testConfigs, setTestConfigs] = useState({});
            const [statusMsg, setStatusMsg] = useState(null);

            useEffect(() => {
                getGroupedProtocols().then(setProtocols).catch(() => setProtocols({}));
            }, []);

            const handleProductTypeChange = (e) => {
                const type = e.target.value;
                setForm({ ...form, product_type: type });
                const requiredTests = protocols[type] || [];

                const newConfigs = {};
                requiredTests.forEach(test => {
                    newConfigs[test] = { include: false, assignee_id: '', is_all_day: true, start_time: '', end_time: '', duration_days: 1 };
                });
                setTestConfigs(newConfigs);
            };

            const handleTestChange = (testName, field, value) => {
                setTestConfigs(prev => ({
                    ...prev, [testName]: { ...prev[testName], [field]: value }
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const payload = [];
                for (const [testName, config] of Object.entries(testConfigs)) {
                    if (config.include) {
                        if (!config.assignee_id || !config.start_time || (!config.is_all_day && !config.end_time)) {
                            alert(`Please complete all required fields for included test: ${testName}`);
                            return;
                        }
                        payload.push({
                            product_id: form.product_id,
                            batch_number: form.batch_number,
                            product_type: form.product_type,
                            test_name: testName,
                            assignee_id: config.assignee_id,
                            start_time: config.start_time,
                            end_time: config.is_all_day ? "" : config.end_time,
                            is_all_day: config.is_all_day,
                            duration_days: config.is_all_day ? config.duration_days : null
                        });
                    }
                }

                if(payload.length === 0) return alert("No tests selected. Please include at least one test.");

                setStatusMsg({type: 'info', text: "Saving schedules..."});
                try {
                    await Promise.all(payload.map(item => saveDoc("schedules", { ...item, status: "Scheduled" })));
                    setStatusMsg({type: 'success', text: "Schedules saved successfully."});
                    setForm({ product_id: '', batch_number: '', product_type: '' });
                    setTestConfigs({});
                } catch(err) {
                    setStatusMsg({type: 'error', text: "Error saving schedules."});
                }
            };

            return (
                <div className="bg-white p-6 rounded shadow-md max-w-5xl mx-auto border-t-4 border-qcRed">
                    <h2 className="text-2xl font-bold mb-6 text-qcGray border-b pb-2">Create New Schedule</h2>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-3 gap-4 bg-gray-50 p-4 rounded border">
                            <div>
                                <label className="block text-sm font-bold mb-1 text-qcGray">Product ID</label>
                                <input required className="w-full border p-2 rounded focus:ring-2 focus:ring-qcRed outline-none" type="text" value={form.product_id} onChange={e => setForm({...form, product_id: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-1 text-qcGray">Batch Number</label>
                                <input required className="w-full border p-2 rounded focus:ring-2 focus:ring-qcRed outline-none" type="text" value={form.batch_number} onChange={e => setForm({...form, batch_number: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-1 text-qcGray">Product Type</label>
                                <select required className="w-full border p-2 rounded focus:ring-2 focus:ring-qcRed outline-none" value={form.product_type} onChange={handleProductTypeChange}>
                                    <option value="">-- Select Type --</option>
                                    {Object.keys(protocols).map(pt => <option key={pt} value={pt}>{pt}</option>)}
                                </select>
                            </div>
                        </div>

                        {form.product_type && Object.keys(testConfigs).length > 0 && (
                            <div className="border rounded p-4 bg-white shadow-sm">
                                <h3 className="font-bold text-lg mb-4 text-qcRed">Tests Required for {form.product_type}</h3>
                                {Object.entries(testConfigs).map(([testName, config]) => (
                                    <div key={testName} className={`flex flex-wrap items-center gap-4 mb-4 p-4 border rounded transition-colors ${config.include ? 'bg-red-50 border-red-200' : 'bg-gray-50'}`}>
                                        <div className="w-full md:w-1/4 flex items-center gap-2 font-bold text-qcGray">
                                            <input type="checkbox" className="w-4 h-4 accent-qcRed" checked={config.include} onChange={e => handleTestChange(testName, 'include', e.target.checked)} />
                                            {testName}
                                        </div>

                                        <select disabled={!config.include} required={config.include} className="border p-2 rounded flex-1 min-w-[150px] outline-none focus:border-qcRed" value={config.assignee_id} onChange={e => handleTestChange(testName, 'assignee_id', e.target.value)}>
                                            <option value="">Assignee...</option>
                                            {personnel.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>

                                        <label className={`flex items-center gap-2 text-sm font-bold whitespace-nowrap bg-white px-3 py-2 border rounded ${!config.include ? 'opacity-50' : ''}`}>
                                            <input disabled={!config.include} type="checkbox" className="w-4 h-4 accent-qcRed" checked={config.is_all_day} onChange={e => handleTestChange(testName, 'is_all_day', e.target.checked)} />
                                            All Day
                                        </label>

                                        {config.is_all_day ? (
                                            <>
                                                <input disabled={!config.include} required={config.include} type="date" className="border p-2 rounded flex-1 min-w-[140px] text-sm outline-none focus:border-qcRed" value={config.start_time.split('T')[0]} onChange={e => handleTestChange(testName, 'start_time', e.target.value)} title="Start Date" />
                                                <select disabled={!config.include} required={config.include} className="border p-2 rounded flex-1 min-w-[120px] text-sm outline-none focus:border-qcRed" value={config.duration_days} onChange={e => handleTestChange(testName, 'duration_days', parseInt(e.target.value))}>
                                                    <option value={1}>1 Day</option>
                                                    <option value={2}>2 Days</option>
                                                    <option value={3}>3 Days</option>
                                                </select>
                                            </>
                                        ) : (
                                            <>
                                                <input disabled={!config.include} required={config.include} type="datetime-local" className="border p-2 rounded flex-1 min-w-[180px] text-sm outline-none focus:border-qcRed" value={config.start_time} onChange={e => handleTestChange(testName, 'start_time', e.target.value)} title="Start Time" />
                                                <input disabled={!config.include} required={config.include} type="datetime-local" className="border p-2 rounded flex-1 min-w-[180px] text-sm outline-none focus:border-qcRed" value={config.end_time} onChange={e => handleTestChange(testName, 'end_time', e.target.value)} title="End Time" />
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        <button type="submit" className="bg-qcRed text-white px-8 py-3 rounded hover:bg-red-800 font-bold shadow-md text-lg transition-colors">Save Schedules</button>
                        {statusMsg && (
                            <p className={`mt-4 p-3 border rounded font-bold ${statusMsg.type==='success' ? 'bg-green-100 text-green-800 border-green-300' : (statusMsg.type==='error' ? 'bg-red-100 text-red-800 border-red-300' : 'bg-blue-100 text-blue-800 border-blue-300')}`}>
                                {statusMsg.text}
                            </p>
                        )}
                    </form>
                </div>
            );
        };

        // =========================================================================
        // REUSABLE EDIT SCHEDULE FORM (Used in Tabs 2 and 5)
        // =========================================================================
        const EditScheduleForm = ({ editItem, setEditItem, onSave }) => {
            return (
                <form onSubmit={(e) => { e.preventDefault(); onSave(editItem); }} className="space-y-4">
                    <div>
                        <label className="block text-sm font-bold text-qcGray">Test Name</label>
                        <input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.test_name} onChange={e=>setEditItem({...editItem, test_name: e.target.value})} />
                    </div>
                    <div>
                        <label className="block text-sm font-bold text-qcGray">Assignee</label>
                        <select className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.assignee_id} onChange={e=>setEditItem({...editItem, assignee_id: e.target.value})}>
                            {window.personnelList?.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                    </div>
                    <div className="flex items-center gap-2">
                        <input type="checkbox" className="w-4 h-4 accent-qcRed" checked={editItem.is_all_day} onChange={e=>setEditItem({...editItem, is_all_day: e.target.checked})} />
                        <label className="font-bold text-sm text-qcGray">All Day Event</label>
                    </div>
                    {editItem.is_all_day ? (
                        <div className="flex gap-4">
                            <div className="w-1/2">
                                <label className="block text-xs font-bold text-qcGray">Start Date</label>
                                <input type="date" className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.start_time.split('T')[0]} onChange={e=>setEditItem({...editItem, start_time: e.target.value})} />
                            </div>
                            <div className="w-1/2">
                                <label className="block text-xs font-bold text-qcGray">Duration</label>
                                <select className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.duration_days} onChange={e=>setEditItem({...editItem, duration_days: parseInt(e.target.value)})}>
                                    <option value={1}>1 Day</option><option value={2}>2 Days</option><option value={3}>3 Days</option>
                                </select>
                            </div>
                        </div>
                    ) : (
                        <div className="flex gap-4">
                            <div className="w-1/2">
                                <label className="block text-xs font-bold text-qcGray">Start Time</label>
                                <input type="datetime-local" className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.start_time} onChange={e=>setEditItem({...editItem, start_time: e.target.value})} />
                            </div>
                            <div className="w-1/2">
                                <label className="block text-xs font-bold text-qcGray">End Time</label>
                                <input type="datetime-local" className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.end_time} onChange={e=>setEditItem({...editItem, end_time: e.target.value})} />
                            </div>
                        </div>
                    )}
                    <div>
                        <label className="block text-sm font-bold text-qcGray">Status</label>
                        <select className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.status} onChange={e=>setEditItem({...editItem, status: e.target.value})}>
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <button type="submit" className="bg-qcRed text-white px-4 py-2 rounded w-full font-bold hover:bg-red-800 transition-colors">Save Changes</button>
                </form>
            );
        };

        // =========================================================================
        // TAB 2: SCHEDULES
        // =========================================================================
        const SchedulesTab = ({ personnel }) => {
            const [schedules, setSchedules] = useState([]);
            const [editItem, setEditItem] = useState(null);
            const [toast, setToast] = useState(null);

            // Filtering
            const [filterStatus, setFilterStatus] = useState("All");
            const [filterAssignee, setFilterAssignee] = useState("All");
            const [filterProductType, setFilterProductType] = useState("All");
            const [filterProductId, setFilterProductId] = useState("All");
            const [filterBatchNumber, setFilterBatchNumber] = useState("All");

            // Sorting
            const [sortField, setSortField] = useState("start_time");
            const [sortOrder, setSortOrder] = useState("desc");

            window.personnelList = personnel; // hack for shared component

            const fetchSchedules = () => listDocs("schedules", "start_time", "desc").then(setSchedules);
            useEffect(() => { fetchSchedules(); }, []);

            const action = async (id, type) => {
                if (type === "complete") {
                    await db.collection("schedules").doc(id).update({ status: "Completed" });
                }
                if (type === "delete") {
                    await deleteDoc("schedules", id);
                }
                fetchSchedules();
            };

            const handleResend = async () => {
                try {
                    setToast("Email invite sending requires a deployed mail service. Download the .ics file instead.");
                    setTimeout(() => setToast(null), 4000);
                } catch (e) {
                    setToast("Unable to prepare invite.");
                    setTimeout(() => setToast(null), 3000);
                }
            };

            const handleEditSave = async (updatedItem) => {
                await saveDoc("schedules", updatedItem, updatedItem.id);
                setEditItem(null);
                fetchSchedules();
            };

            const toggleSort = (field) => {
                if (sortField === field) {
                    setSortOrder(sortOrder === 'asc' ? 'desc' : 'asc');
                } else {
                    setSortField(field);
                    setSortOrder('asc');
                }
            };

            const getPersonnelName = (id) => personnel.find(p=>p.id === id)?.name || "Unknown";
            const productTypes = [...new Set(schedules.map(s => s.product_type))].filter(Boolean);
            const productIds = [...new Set(schedules.map(s => s.product_id))].filter(Boolean);
            const batchNumbers = [...new Set(schedules.map(s => s.batch_number))].filter(Boolean);

            let filtered = schedules.filter(s => {
                return (filterStatus === "All" || s.status === filterStatus) &&
                       (filterAssignee === "All" || s.assignee_id === filterAssignee) &&
                       (filterProductType === "All" || s.product_type === filterProductType) &&
                       (filterProductId === "All" || s.product_id === filterProductId) &&
                       (filterBatchNumber === "All" || s.batch_number === filterBatchNumber);
            });

            filtered.sort((a, b) => {
                let valA = a[sortField] || "";
                let valB = b[sortField] || "";
                if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            return (
                <div className="bg-white p-6 rounded shadow-md border-t-4 border-qcRed relative">
                    {toast && (
                        <div className="fixed bottom-4 right-4 bg-gray-800 text-white font-bold px-6 py-3 rounded shadow-lg z-50 animate-bounce">
                            {toast}
                        </div>
                    )}
                    <h2 className="text-2xl font-bold mb-4 text-qcGray">Test Schedules</h2>

                    <div className="flex flex-wrap gap-4 mb-6 bg-gray-50 p-4 rounded border">
                        <div>
                            <label className="block text-xs font-bold text-qcGray uppercase mb-1">Status</label>
                            <select className="border p-2 rounded text-sm text-qcGray outline-none" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
                                <option value="All">All Statuses</option>
                                <option value="Scheduled">Scheduled</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-qcGray uppercase mb-1">Assignee</label>
                            <select className="border p-2 rounded text-sm text-qcGray outline-none" value={filterAssignee} onChange={e=>setFilterAssignee(e.target.value)}>
                                <option value="All">All Assignees</option>
                                {personnel.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-qcGray uppercase mb-1">Product Type</label>
                            <select className="border p-2 rounded text-sm text-qcGray outline-none" value={filterProductType} onChange={e=>setFilterProductType(e.target.value)}>
                                <option value="All">All Types</option>
                                {productTypes.map(pt => <option key={pt} value={pt}>{pt}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-qcGray uppercase mb-1">Product ID</label>
                            <select className="border p-2 rounded text-sm text-qcGray outline-none" value={filterProductId} onChange={e=>setFilterProductId(e.target.value)}>
                                <option value="All">All Products</option>
                                {productIds.map(pid => <option key={pid} value={pid}>{pid}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-qcGray uppercase mb-1">Batch Number</label>
                            <select className="border p-2 rounded text-sm text-qcGray outline-none" value={filterBatchNumber} onChange={e=>setFilterBatchNumber(e.target.value)}>
                                <option value="All">All Batches</option>
                                {batchNumbers.map(bn => <option key={bn} value={bn}>{bn}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-max">
                            <thead>
                                <tr className="bg-gray-100 border-b-2 border-qcRed">
                                    <th className="p-3 cursor-pointer select-none hover:bg-gray-200 transition-colors" onClick={() => toggleSort('test_name')}>
                                        Test Name {sortField === 'test_name' && (sortOrder === 'asc' ? '^' : 'v')}
                                    </th>
                                    <th className="p-3 cursor-pointer select-none hover:bg-gray-200 transition-colors" onClick={() => toggleSort('product_id')}>
                                        Product ID {sortField === 'product_id' && (sortOrder === 'asc' ? '^' : 'v')}
                                    </th>
                                    <th className="p-3 cursor-pointer select-none hover:bg-gray-200 transition-colors" onClick={() => toggleSort('batch_number')}>
                                        Batch Number {sortField === 'batch_number' && (sortOrder === 'asc' ? '^' : 'v')}
                                    </th>
                                    <th className="p-3">Assignee</th>
                                    <th className="p-3 cursor-pointer select-none hover:bg-gray-200 transition-colors" onClick={() => toggleSort('start_time')}>
                                        Date(s) {sortField === 'start_time' && (sortOrder === 'asc' ? '^' : 'v')}
                                    </th>
                                    <th className="p-3">Status</th>
                                    <th className="p-3 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.map(s => (
                                    <tr key={s.id} className="border-b hover:bg-gray-50 transition-colors">
                                        <td className="p-3 font-bold text-qcGray">{s.test_name}</td>
                                        <td className="p-3">{s.product_id}</td>
                                        <td className="p-3 font-mono text-sm">{s.batch_number}</td>
                                        <td className="p-3">{getPersonnelName(s.assignee_id)}</td>
                                        <td className="p-3 text-sm">
                                            {s.is_all_day ? `${s.start_time.split('T')[0]} (${s.duration_days} Day${s.duration_days>1?'s':''})` : s.start_time.replace('T', ' ')}
                                        </td>
                                        <td className="p-3">
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm ${s.status==='Completed'?'bg-qcGray':'bg-qcRed'}`}>{s.status}</span>
                                        </td>
                                        <td className="p-3 space-x-2 text-sm font-bold text-center whitespace-nowrap">
                                            <button onClick={()=>setEditItem(s)} className="text-blue-600 hover:text-blue-800">Edit</button>
                                            {s.status !== 'Completed' && <button onClick={()=>action(s.id, 'complete')} className="text-green-600 hover:text-green-800">Complete</button>}
                                            <button onClick={()=>action(s.id, 'delete')} className="text-red-600 hover:text-red-800">Delete</button>
                                            <button onClick={()=>handleResend(s.id)} className="text-indigo-600 hover:text-indigo-800">Resend Invite</button>
                                            <button onClick={()=>downloadIcs(s, personnel)} className="text-qcGray hover:text-qcRed inline-block bg-gray-200 px-2 py-1 rounded">.ics</button>
                                        </td>
                                    </tr>
                                ))}
                                {filtered.length === 0 && (
                                    <tr><td colSpan="7" className="p-6 text-center text-gray-500 font-bold">No schedules found matching the current filters.</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {editItem && (
                        <Modal title="Edit Schedule" onClose={()=>setEditItem(null)}>
                            <EditScheduleForm editItem={editItem} setEditItem={setEditItem} onSave={handleEditSave} />
                        </Modal>
                    )}
                </div>
            );
        };

        // =========================================================================
        // TAB 5: CALENDAR VIEW
        // =========================================================================
        const CalendarTab = ({ personnel }) => {
            const calendarRef = useRef(null);
            const [schedules, setSchedules] = useState([]);
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [editFormItem, setEditFormItem] = useState(null);

            window.personnelList = personnel; // hack for shared component

            const fetchSchedules = () => {
                listDocs("schedules", "start_time", "desc").then(setSchedules);
            };
            useEffect(() => { fetchSchedules(); }, []);

            useEffect(() => {
                if (calendarRef.current && window.FullCalendar) {
                    const getInitials = (name) => {
                        return name.split(' ').map(n=>n[0]).join('').toUpperCase().substring(0,2);
                    };

                    const events = schedules.map(s => {
                        const pName = personnel.find(p => p.id === s.assignee_id)?.name || "Unknown";
                        const initials = getInitials(pName);
                        const title = `${initials}_${s.product_id}_${s.test_name}`;

                        let startStr = s.start_time;
                        let endStr = s.end_time;
                        let allDay = s.is_all_day;

                        if (allDay) {
                            startStr = s.start_time.split('T')[0];
                            const endDate = new Date(startStr);
                            endDate.setDate(endDate.getDate() + (s.duration_days || 1));
                            endStr = endDate.toISOString().split('T')[0];
                        }

                        return {
                            id: s.id,
                            title: title,
                            start: startStr,
                            end: endStr,
                            allDay: allDay,
                            backgroundColor: s.status === 'Completed' ? '#303B41' : '#AD122A',
                            borderColor: s.status === 'Completed' ? '#303B41' : '#AD122A',
                            textColor: '#ffffff',
                            extendedProps: { ...s, assignee_name: pName }
                        };
                    });

                    const calendar = new window.FullCalendar.Calendar(calendarRef.current, {
                        initialView: 'dayGridMonth',
                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: 'dayGridMonth,timeGridWeek,timeGridDay'
                        },
                        events: events,
                        eventClick: function(info) {
                            setSelectedEvent(info.event.extendedProps);
                            setIsEditing(false);
                        },
                        height: 750
                    });

                    calendar.render();

                    return () => {
                        calendar.destroy();
                    };
                }
            }, [schedules, personnel]);

            const markComplete = async (id) => {
                await db.collection("schedules").doc(id).update({ status: "Completed" });
                setSelectedEvent(null);
                fetchSchedules();
            };

            const saveEdit = async (updatedItem) => {
                await saveDoc("schedules", updatedItem, updatedItem.id);
                setSelectedEvent(null);
                setIsEditing(false);
                fetchSchedules();
            };

            const startEditing = () => {
                setEditFormItem(selectedEvent);
                setIsEditing(true);
            };

            return (
                <div className="bg-white p-6 rounded shadow-md border-t-4 border-qcRed">
                    <h2 className="text-2xl font-bold mb-4 text-qcGray border-b pb-2">QC Schedule Calendar</h2>
                    <div ref={calendarRef} className="mt-4 fc-theme-standard"></div>

                    {selectedEvent && (
                        <Modal title={isEditing ? "Edit Schedule" : "Schedule Details"} onClose={() => {setSelectedEvent(null); setIsEditing(false);}}>
                            {isEditing ? (
                                <EditScheduleForm editItem={editFormItem} setEditItem={setEditFormItem} onSave={saveEdit} />
                            ) : (
                                <div className="space-y-3 text-lg text-qcGray">
                                    <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded border">
                                        <p><strong>Test Name:</strong> <br/>{selectedEvent.test_name}</p>
                                        <p><strong>Assignee:</strong> <br/>{selectedEvent.assignee_name}</p>
                                        <p><strong>Product ID:</strong> <br/>{selectedEvent.product_id}</p>
                                        <p><strong>Batch:</strong> <br/>{selectedEvent.batch_number}</p>
                                        <p><strong>Type:</strong> <br/>{selectedEvent.product_type}</p>
                                        <p>
                                            <strong>Status:</strong><br/>
                                            <span className={`inline-block mt-1 px-3 py-1 rounded-full text-sm font-bold text-white ${selectedEvent.status==='Completed'?'bg-qcGray':'bg-qcRed'}`}>
                                                {selectedEvent.status}
                                            </span>
                                        </p>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded border">
                                        {selectedEvent.is_all_day ? (
                                            <>
                                                <p><strong>Timing:</strong> All Day Event</p>
                                                <p><strong>Start Date:</strong> {selectedEvent.start_time.split('T')[0]}</p>
                                                <p><strong>Duration:</strong> {selectedEvent.duration_days} Day(s)</p>
                                            </>
                                        ) : (
                                            <>
                                                <p><strong>Start:</strong> {selectedEvent.start_time.replace('T', ' ')}</p>
                                                <p><strong>End:</strong> {selectedEvent.end_time.replace('T', ' ')}</p>
                                            </>
                                        )}
                                    </div>

                                    <div className="flex gap-3 pt-4 border-t">
                                        <button onClick={startEditing} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold flex-1 transition-colors">Edit Schedule</button>
                                        {selectedEvent.status !== 'Completed' && (
                                            <button onClick={() => markComplete(selectedEvent.id)} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold flex-1 transition-colors">Mark as Complete</button>
                                        )}
                                    </div>
                                </div>
                            )}
                        </Modal>
                    )}
                </div>
            );
        };

        // =========================================================================
        // TAB 3: PRODUCTS & PROTOCOLS
        // =========================================================================
        const ProductsProtocolsTab = () => {
            const [products, setProducts] = useState([]);
            const [protocols, setProtocols] = useState([]);

            const [prodEdit, setProdEdit] = useState(null);
            const [protEdit, setProtEdit] = useState(null);

            const fetchData = () => {
                listDocs("products").then(setProducts);
                listDocs("protocols").then(setProtocols);
            };
            useEffect(() => { fetchData(); }, []);

            const saveItem = async (endpoint, payload, isEdit, id) => {
                await saveDoc(endpoint, payload, isEdit ? id : null);
                fetchData();
                setProdEdit(null); setProtEdit(null);
            };

            const delItem = async (endpoint, id) => {
                if(!confirm("Are you sure you want to delete this?")) return;
                await deleteDoc(endpoint, id);
                fetchData();
            };

            return (
                <div className="grid lg:grid-cols-2 gap-8">
                    <div className="bg-white p-6 rounded shadow-md border-t-4 border-qcRed">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h2 className="text-xl font-bold text-qcGray">Products</h2>
                            <button onClick={()=>setProdEdit({name:'', description:'', product_type:'', test_frequency:''})} className="bg-qcGray text-white px-4 py-2 rounded text-sm font-bold hover:bg-black transition-colors">+ Add Product</button>
                        </div>
                        <ul className="space-y-3">
                            {products.map(p => (
                                <li key={p.id} className="border border-gray-200 p-4 rounded flex justify-between items-center bg-gray-50 hover:bg-white transition-colors">
                                    <div><strong className="block text-lg text-qcRed">{p.name}</strong><span className="text-sm font-bold text-qcGray">{p.product_type}</span></div>
                                    <div className="space-x-3 text-sm font-bold">
                                        <button onClick={()=>setProdEdit(p)} className="text-blue-600 hover:text-blue-800">Edit</button>
                                        <button onClick={()=>delItem('products', p.id)} className="text-red-600 hover:text-red-800">Delete</button>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>

                    <div className="bg-white p-6 rounded shadow-md border-t-4 border-qcRed">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h2 className="text-xl font-bold text-qcGray">Protocols</h2>
                            <button onClick={()=>setProtEdit({name:'', protocol_id:'', product_type:'', tests:[]})} className="bg-qcGray text-white px-4 py-2 rounded text-sm font-bold hover:bg-black transition-colors">+ Add Protocol</button>
                        </div>
                        <ul className="space-y-3">
                            {protocols.map(p => (
                                <li key={p.id} className="border border-gray-200 p-4 rounded flex justify-between items-center bg-gray-50 hover:bg-white transition-colors">
                                    <div><strong className="block text-lg text-qcRed">{p.name}</strong><span className="text-sm font-bold text-qcGray block">{p.product_type}</span><span className="text-xs text-gray-500 font-mono mt-1 block">Tests: {p.tests.join(', ')}</span></div>
                                    <div className="space-x-3 text-sm font-bold">
                                        <button onClick={()=>setProtEdit(p)} className="text-blue-600 hover:text-blue-800">Edit</button>
                                        <button onClick={()=>delItem('protocols', p.id)} className="text-red-600 hover:text-red-800">Delete</button>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>

                    {prodEdit && (
                        <Modal title={prodEdit.id ? "Edit Product" : "Add Product"} onClose={()=>setProdEdit(null)}>
                            <div className="space-y-4">
                                <div><label className="text-sm font-bold text-qcGray">Product Name</label><input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={prodEdit.name} onChange={e=>setProdEdit({...prodEdit, name: e.target.value})} /></div>
                                <div><label className="text-sm font-bold text-qcGray">Product Type</label><input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={prodEdit.product_type} onChange={e=>setProdEdit({...prodEdit, product_type: e.target.value})} /></div>
                                <div><label className="text-sm font-bold text-qcGray">Test Frequency</label><input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={prodEdit.test_frequency} onChange={e=>setProdEdit({...prodEdit, test_frequency: e.target.value})} /></div>
                                <button onClick={()=>saveItem('products', prodEdit, !!prodEdit.id, prodEdit.id)} className="bg-qcRed hover:bg-red-800 text-white px-4 py-3 w-full rounded font-bold mt-2 transition-colors">Save Product</button>
                            </div>
                        </Modal>
                    )}
                    {protEdit && (
                        <Modal title={protEdit.id ? "Edit Protocol" : "Add Protocol"} onClose={()=>setProtEdit(null)}>
                            <div className="space-y-4">
                                <div><label className="text-sm font-bold text-qcGray">Protocol Name</label><input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={protEdit.name} onChange={e=>setProtEdit({...protEdit, name: e.target.value})} /></div>
                                <div><label className="text-sm font-bold text-qcGray">Product Type</label><input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={protEdit.product_type} onChange={e=>setProtEdit({...protEdit, product_type: e.target.value})} /></div>
                                <div><label className="text-sm font-bold text-qcGray">Tests (comma separated)</label><input className="w-full border p-2 rounded font-mono outline-none focus:border-qcRed" value={protEdit.tests.join(', ')} onChange={e=>setProtEdit({...protEdit, tests: e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})} /></div>
                                <button onClick={()=>saveItem('protocols', protEdit, !!protEdit.id, protEdit.id)} className="bg-qcRed hover:bg-red-800 text-white px-4 py-3 w-full rounded font-bold mt-2 transition-colors">Save Protocol</button>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        // =========================================================================
        // TAB 4: PERSONNEL
        // =========================================================================
        const PersonnelTab = ({ personnel, fetchPersonnel }) => {
            const [editItem, setEditItem] = useState(null);

            const saveItem = async () => {
                await saveDoc("personnel", editItem, editItem.id || null);
                fetchPersonnel();
                setEditItem(null);
            };

            const delItem = async (id) => {
                if(!confirm("Are you sure you want to delete this analyst?")) return;
                await deleteDoc("personnel", id);
                fetchPersonnel();
            };

            return (
                <div className="bg-white p-6 rounded shadow-md max-w-5xl mx-auto border-t-4 border-qcRed">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <h2 className="text-2xl font-bold text-qcGray">Laboratory Personnel</h2>
                        <button onClick={()=>setEditItem({name:'', email:'', role:'Analyst', active:true})} className="bg-qcGray hover:bg-black text-white px-6 py-2 rounded font-bold transition-colors shadow-sm">+ Add Analyst</button>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-100 border-b-2 border-qcRed"><th className="p-4 font-bold text-qcGray">Name</th><th className="p-4 font-bold text-qcGray">Email</th><th className="p-4 font-bold text-qcGray">Role</th><th className="p-4 font-bold text-qcGray">Status</th><th className="p-4 font-bold text-qcGray">Actions</th></tr></thead>
                            <tbody>
                                {personnel.map(p => (
                                    <tr key={p.id} className="border-b hover:bg-gray-50 transition-colors">
                                        <td className="p-4 font-bold text-qcRed">{p.name}</td>
                                        <td className="p-4 text-qcGray">{p.email}</td>
                                        <td className="p-4 font-bold text-qcGray">{p.role}</td>
                                        <td className="p-4"><span className={`px-3 py-1 text-xs rounded-full font-bold text-white shadow-sm ${p.active?'bg-green-500':'bg-red-500'}`}>{p.active?'Active':'Inactive'}</span></td>
                                        <td className="p-4 space-x-3 text-sm font-bold"><button onClick={()=>setEditItem(p)} className="text-blue-600 hover:text-blue-800">Edit</button><button onClick={()=>delItem(p.id)} className="text-red-600 hover:text-red-800">Delete</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {editItem && (
                        <Modal title={editItem.id ? "Edit Personnel" : "Add Personnel"} onClose={()=>setEditItem(null)}>
                            <div className="space-y-4">
                                <div><label className="text-sm font-bold text-qcGray">Full Name</label><input className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.name} onChange={e=>setEditItem({...editItem, name: e.target.value})} /></div>
                                <div><label className="text-sm font-bold text-qcGray">Email Address</label><input type="email" className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.email} onChange={e=>setEditItem({...editItem, email: e.target.value})} /></div>
                                <div>
                                    <label className="text-sm font-bold text-qcGray">Role</label>
                                    <select className="w-full border p-2 rounded outline-none focus:border-qcRed" value={editItem.role} onChange={e=>setEditItem({...editItem, role: e.target.value})}>
                                        <option value="Analyst">Analyst</option><option value="Supervisor">Supervisor</option><option value="QA">QA</option><option value="Manager">Manager</option>
                                    </select>
                                </div>
                                <label className="flex items-center gap-2 pt-2"><input type="checkbox" className="w-5 h-5 accent-qcRed" checked={editItem.active} onChange={e=>setEditItem({...editItem, active: e.target.checked})}/> <span className="font-bold text-qcGray">Active Employee</span></label>
                                <button onClick={saveItem} className="bg-qcRed hover:bg-red-800 text-white px-4 py-3 w-full rounded font-bold mt-4 shadow transition-colors">Save Personnel</button>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        const ConfigRequired = () => (
            <div className="min-h-screen flex items-center justify-center p-6">
                <div className="bg-white border-t-4 border-qcRed rounded shadow-md max-w-xl w-full p-6">
                    <h1 className="text-2xl font-black text-qcGray mb-3">Firebase setup required</h1>
                    <p className="text-qcGray mb-4">
                        Add your Firebase Web App config to <span className="font-mono bg-gray-100 px-1">firebase-config.js</span> before publishing.
                    </p>
                    <p className="text-sm text-gray-600">
                        Use <span className="font-mono bg-gray-100 px-1">firebase-config.example.js</span> as the template. Do not upload a service account key.
                    </p>
                </div>
            </div>
        );

        const AuthScreen = () => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [mode, setMode] = useState("sign-in");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setError("");
                setLoading(true);
                try {
                    if (mode === "register") {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message || "Authentication failed.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-qcBg">
                    <form onSubmit={submit} className="bg-white border-t-4 border-qcRed rounded shadow-md max-w-md w-full p-6 space-y-4">
                        <div>
                            <h1 className="text-2xl font-black text-qcGray">QC Scheduler</h1>
                            <p className="text-sm text-gray-600 mt-1">{mode === "register" ? "Create an authorized account." : "Sign in to continue."}</p>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-qcGray mb-1">Email</label>
                            <input type="email" required className="w-full border p-3 rounded outline-none focus:border-qcRed" value={email} onChange={e=>setEmail(e.target.value)} />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-qcGray mb-1">Password</label>
                            <input type="password" required minLength="6" className="w-full border p-3 rounded outline-none focus:border-qcRed" value={password} onChange={e=>setPassword(e.target.value)} />
                        </div>
                        {error && <p className="bg-red-50 border border-red-200 text-red-700 p-3 rounded text-sm font-bold">{error}</p>}
                        <button disabled={loading} className="bg-qcRed hover:bg-red-800 disabled:opacity-60 text-white px-4 py-3 w-full rounded font-bold transition-colors">
                            {loading ? "Please wait..." : (mode === "register" ? "Create Account" : "Sign In")}
                        </button>
                        <button type="button" onClick={()=>setMode(mode === "register" ? "sign-in" : "register")} className="text-qcGray hover:text-qcRed text-sm font-bold w-full">
                            {mode === "register" ? "Use an existing account" : "Create a new account"}
                        </button>
                    </form>
                </div>
            );
        };

        // =========================================================================
        // MAIN APP COMPONENT
        // =========================================================================
        const App = () => {
            const [activeTab, setActiveTab] = useState("Create Schedule");
            const [personnel, setPersonnel] = useState([]);
            const [user, setUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);

            const fetchPersonnel = () => listDocs("personnel").then(setPersonnel);
            useEffect(() => {
                if (!auth) return;
                return auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    setAuthReady(true);
                });
            }, []);
            useEffect(() => { if (user) fetchPersonnel(); }, [user]);

            const TABS = ["Create Schedule", "Schedules", "Products & Protocols", "Personnel", "Calendar View"];

            if (missingFirebaseConfig) return <ConfigRequired />;
            if (!authReady) return <div className="min-h-screen flex items-center justify-center font-bold text-qcGray">Loading...</div>;
            if (!user) return <AuthScreen />;

            return (
                <div>
                    <nav className="bg-qcGray text-white shadow-lg sticky top-0 z-40">
                        <div className="max-w-[1400px] mx-auto px-6 py-4 flex items-center justify-between">
                            <h1 className="text-2xl font-black tracking-wider flex items-center gap-3">
                                <span className="bg-white text-qcRed rounded-full p-1 shadow-md">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                                </span>
                                QC Scheduler
                            </h1>
                            <div className="space-x-1">
                                {TABS.map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)}
                                        className={`px-4 py-2 rounded font-bold transition-all ${activeTab === tab ? 'bg-qcRed text-white shadow-inner' : 'hover:bg-gray-700 text-gray-300'}`}>
                                        {tab}
                                    </button>
                                ))}
                                <button onClick={() => auth.signOut()} className="px-4 py-2 rounded font-bold transition-all hover:bg-gray-700 text-gray-300">Sign Out</button>
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-[1400px] mx-auto p-6 mt-4">
                        {activeTab === "Create Schedule" && <CreateScheduleTab personnel={personnel} />}
                        {activeTab === "Schedules" && <SchedulesTab personnel={personnel} />}
                        {activeTab === "Products & Protocols" && <ProductsProtocolsTab />}
                        {activeTab === "Personnel" && <PersonnelTab personnel={personnel} fetchPersonnel={fetchPersonnel} />}
                        {activeTab === "Calendar View" && <CalendarTab personnel={personnel} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
