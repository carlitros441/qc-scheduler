name: Send Pending Email Invites

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/send-emails.yml"
      - "scripts/email-worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-pending-email-invites
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts/email-worker
        run: npm install --omit=dev

      - name: Send pending invites once per minute
        working-directory: scripts/email-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        shell: bash
        run: |
          for minute in 1 2 3 4 5; do
            echo "Email worker pass ${minute}/5"
            node send-emails.js
            if [ "$minute" != "5" ]; then
              sleep 60
            fi
          done
